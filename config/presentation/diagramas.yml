# Diagramas do projeto. Cada um tem slide próprio (modelo-conceitual, casos-de-uso,
# fluxo-ocorrencias no roteiro.yml) e um não substitui o outro.
#
# exigido_em: texto do selo exibido no slide (ex.: "2ª entrega"); vazio quando não houver.
#
# Para publicar um diagrama:
#   1. salve a imagem (PNG ou SVG) em app/assets/images/presentation/diagramas/
#   2. preencha "imagem" com o caminho relativo a app/assets/images
#      (ex.: "presentation/diagramas/casos-de-uso-v1.png")
#   3. informe versao, origem e data; ajuste o estado.

itens:
  - id: modelo-conceitual
    titulo: "Modelo conceitual"
    descricao: "Pessoa usuária, papéis, alerta (ocorrência ou pânico), categoria, local, foto, publicação revisada, comentário, denúncia, interações e auditoria, com multiplicidades. Premissas provisórias a validar."
    exigido_em: "2ª entrega"
    card:
      numero: 6
      titulo: "Modelar ocorrências e criar migração inicial"
      url: "https://trello.com/c/a8kascTx/6-dados-modelar-ocorr%C3%AAncias-e-criar-migra%C3%A7%C3%A3o-inicial"
    # parcial: diagrama produzido a partir do schema real; depende da revisão da equipe.
    estado: parcial
    imagem:
    renderizacao: html_css
    versao: "2"
    origem: "Card #6 — derivado das migrações e do db/schema.rb"
    data: 2026-10-02
    # Três situações independentes. Não marque a revisão como concluída sem registro da equipe.
    producao:          # diagrama tecnicamente produzido
      estado: implementado
      nota: "Desenhado em HTML/CSS a partir de data_diagrams.yml; cardinalidades conferidas com models e migrações."
    revisao_equipe:    # leitura e aprovação pela equipe
      estado: aguardando_evidencia
      data:
      responsaveis: []
      nota: "Registrar quem revisou, quando e o que mudou."
    premissas:         # regras de requisitos que o modelo assume
      estado: aguardando_decisao
      nota: "Foto opcional, visibilidade restrita (autor + gestão) e acesso de coordenação/segurança dependem do card #13."
  - id: casos-de-uso
    titulo: "Diagrama de casos de uso"
    descricao: "Atores do SGU e o que cada um pode fazer no sistema."
    exigido_em: "1ª entrega"
    card:
      numero: 14
      titulo: "Criar diagrama de casos de uso do SGU"
      url: "https://trello.com/c/YdQk4x6A/14-uml-criar-diagrama-de-casos-de-uso-do-sgu"
    estado: aguardando_evidencia
    imagem:
    versao:
    origem:
    data:
  - id: fluxo-ocorrencias
    titulo: "Fluxo de ocorrências e emergências (revisado)"
    descricao: "Caminho de uma ocorrência comum e de uma emergência, do registro ao encerramento."
    exigido_em:
    card:
      numero: 5
      titulo: "Revisar fluxo de ocorrências e emergências"
      url: "https://trello.com/c/B5FgQnRl/5-diagrama-revisar-fluxo-de-ocorr%C3%AAncias-e-emerg%C3%AAncias"
    estado: aguardando_evidencia
    imagem:
    versao:
    origem:
    data:
