# Dados gerais do projeto e de cada entrega acadêmica.
# Guia de manutenção: config/presentation/LEIAME.md
#
# Estados válidos em todos os arquivos desta pasta:
#   implementado | parcial | planejado | aguardando_decisao | aguardando_evidencia

projeto:
  sigla: "SGU"
  nome: "Sistema de Gerenciamento Urbano"
  recorte: "Comunicação e acompanhamento de ocorrências no campus da UFRPE"
  aviso: "Projeto acadêmico da disciplina. Não é um serviço oficial da UFRPE."

instituicao: "Universidade Federal Rural de Pernambuco — UFRPE"
disciplina: "Engenharia de Software"
professora: "Suzana Sampaio"

equipe:
  - "Lucas Vitor"
  - "Guilherme Santiago"
  - "Jose de Lemos"
  - "Victor Novais"
  - "Alisson Cerqueira"

# Links públicos. Nunca use caminhos locais (C:\, \\wsl, /mnt, /home).
links:
  apresentacao: "https://eduardo-hulkier-zayne.ngrok-free.dev/apresentacao#s-capa"
  qr_code: "presentation/acesso/apresentacao-qr.png"
  github: "https://github.com/lucasact4/engenharia-de-software"
  trello: "https://trello.com/b/1cLXCnNU/sgu-sistema-de-gerenciamento-urbano"

# Entrega usada quando nenhum perfil da apresentação estiver ativo.
entrega_padrao: segunda

# Cada perfil do admin escolhe uma destas entregas. Ela define capa, rodapé, títulos dos slides,
# identificação das exigências, checklist (apêndice) e limite de tempo da estimativa.
#
# id:                       identificador estável salvo no perfil (não renomeie depois de usar).
# titulo / rotulo:          nome completo (capa) e curto (barra superior e selos "2ª entrega · Item 1").
# prazo, data_apresentacao: texto livre exibido na capa.
# duracao_maxima_minutos:   limite da apresentação em minutos; deixe vazio quando não houver.
#
# exigencias: FONTE CENTRAL dos nomes dos slides. Use o texto do enunciado da professora.
#   numero:  número do item no enunciado (vazio para status report e condições).
#   grupo:   item | status_report | condicao.
#   texto:   enunciado exato; vira o título do slide nesta entrega (sem o ponto final).
#   slides:  ids do roteiro.yml que apresentam a exigência. Quando ela é dividida em mais de um
#            slide, cada um pode ter "titulo" com a parte que apresenta.
#            Marcar o slide no perfil não altera o estado técnico da exigência.
#   Um slide sem exigência nesta entrega aparece como "Complementar" e usa o "titulo" do roteiro.yml.
entregas:
  - id: primeira
    titulo: "Primeira Entrega dos Projetos"
    rotulo: "1ª entrega"
    prazo: "23 de setembro de 2026, às 19h30"
    data_apresentacao: "23 de setembro de 2026"
    duracao_maxima_minutos:
    exigencias:
      - numero: 1
        grupo: item
        texto: "Lista de requisitos refinada."
        slides: [ { id: requisitos } ]
        estado: aguardando_evidencia
        observacao: "Depende da consolidação do card #13; há conflitos de requisitos em aberto."
      - numero: 2
        grupo: item
        texto: "Lista de ferramentas e tecnologias escolhidas."
        slides: [ { id: arquitetura } ]
        estado: implementado
        observacao: "Stack comprovada no repositório; versões lidas do Gemfile.lock e de .ruby-version."
      - numero: 3
        grupo: item
        texto: "Diagrama de casos de uso do sistema/App proposto."
        slides: [ { id: casos-de-uso } ]
        estado: aguardando_evidencia
        observacao: "Diagrama concluído conforme informado pela liderança; anexar a imagem ao repositório para exibição neste perfil."
      - numero: 4
        grupo: item
        texto: "Ferramenta de monitoramento dos projetos ativa com os requisitos e links para ambientes — Trello."
        slides: [ { id: gestao } ]
        estado: parcial
        observacao: "Quadro e cards existem; não há ambiente publicado para linkar além do GitHub."
      - numero: 5
        grupo: item
        texto: "Planejamento dos próximos passos do projeto."
        slides: [ { id: proximos-passos } ]
        estado: parcial
        observacao: "Marco visual do mural e próximos passos de evolução do sistema."
      - numero: 6
        grupo: item
        texto: "Reflexão sobre o período (Lições aprendidas)."
        slides: [ { id: retrospectiva } ]
        estado: aguardando_evidencia
        observacao: "Quadro real de retrospectiva com Gostei, Aprendi e Faltou disponível."

  - id: segunda
    titulo: "Segunda Entrega de Projeto — Status Report 2"
    rotulo: "2ª entrega"
    prazo: "19 de outubro de 2026, às 18h"
    # Preencha quando a data da apresentação em sala for confirmada (ex.: "20 de outubro de 2026").
    data_apresentacao:
    duracao_maxima_minutos: 7
    exigencias:
      - numero: 1
        grupo: item
        texto: "Protótipo com o conceito visual do projeto."
        slides: [ { id: conceito-visual } ]
        estado: parcial
        observacao: "Capturas de 04/10 nos temas claro e escuro, já com a nova marca SGU; alertas da landing são demonstrativos. Protótipo separado não anexado."
      - numero: 2
        grupo: item
        texto: "GitHub criado e estruturado com código fonte total ou parcial, contemplando as 2 funcionalidades do sistema proposto (Completas)."
        slides: [ { id: funcionalidades, titulo: "GitHub e duas funcionalidades completas" } ]
        estado: parcial
        observacao: "Duas jornadas implementadas com testes de navegador e catálogo de evidências de código. Captura do GitHub e vínculo aos RFs do #13 pendentes."
      - numero: 3
        grupo: item
        texto: "Imagem de uma retrospectiva."
        slides: [ { id: retrospectiva } ]
        estado: implementado
        observacao: "Quadro real no FunRetrospectives (Gostei · Aprendi · Faltou) anexado, com link da sessão. Data da dinâmica não registrada."
      - numero: 4
        grupo: item
        texto: "Modelo conceitual."
        slides: [ { id: modelo-conceitual } ]
        estado: parcial
        observacao: "Modelo em HTML/CSS com relações e multiplicidades conferidas contra os models e o banco."
      - numero: 5
        grupo: item
        texto: "Evidência de reuniões de monitoramento do projeto."
        slides: [ { id: reunioes } ]
        estado: implementado
        observacao: "Reunião de 03/10/2026, aproximadamente às 18h20, com quatro capturas e pauta. Encaminhamentos ainda não formalizados."
      - grupo: status_report
        texto: "O que foi feito desde a última entrega."
        slides: [ { id: evolucao } ]
        estado: parcial
        observacao: "Evolução publicada na main pelo PR #13, incluindo ocorrências, mural, marca e apresentação."
      - grupo: status_report
        texto: "O que será feito até a próxima entrega."
        slides: [ { id: proximos-passos } ]
        estado: parcial
        observacao: "Posts demonstrados no mural; prioridades de requisitos, e-mail, locais e usabilidade."
      - grupo: status_report
        texto: "O que aprendemos nesse sprint (Imagem de uma retrospectiva)."
        slides: [ { id: status-report, titulo: "O que aprendemos nesse sprint" } ]
        estado: implementado
        observacao: "Aprendizados da coluna Aprendi do quadro real; nenhuma ação combinada formalizada."
      - grupo: condicao
        texto: "Apresentação de no máximo 7 minutos."
        slides: [ { id: roteiro } ]
        estado: parcial
        observacao: "Estimativa calculada a partir dos slides selecionados; ensaio cronometrado pendente."
