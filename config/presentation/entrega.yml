# Dados gerais do projeto e de cada entrega acadêmica.
# Guia de manutenção: config/presentation/LEIAME.md
#
# Estados válidos em todos os arquivos desta pasta:
#   implementado | parcial | planejado | aguardando_decisao | aguardando_evidencia

projeto:
  sigla: "SGU"
  nome: "Sistema de Gerenciamento Urbano"
  recorte: "Comunicação e acompanhamento de ocorrências no campus da UFRPE"
  aviso: "Projeto acadêmico da disciplina. Não é um serviço oficial da UFRPE."

instituicao: "Universidade Federal Rural de Pernambuco — UFRPE"
disciplina: "Engenharia de Software"
professora: "Suzana Sampaio"

equipe:
  - "Lucas Vitor"
  - "Guilherme Santiago"
  - "Jose de Lemos"
  - "Victor Novais"
  - "Alisson Cerqueira"

# Links públicos. Nunca use caminhos locais (C:\, \\wsl, /mnt, /home).
links:
  github: "https://github.com/lucasact4/engenharia-de-software"
  trello: "https://trello.com/b/1cLXCnNU/sgu-sistema-de-gerenciamento-urbano"

# Entrega usada quando nenhum perfil da apresentação estiver ativo.
entrega_padrao: segunda

# Cada perfil do admin escolhe uma destas entregas. Ela define capa, rodapé, checklist
# (apêndice) e o limite de tempo usado no aviso da estimativa.
#
# id:                       identificador estável salvo no perfil (não renomeie depois de usar).
# titulo / rotulo:          nome completo (capa) e curto (barra superior).
# prazo, data_apresentacao: texto livre exibido na capa.
# duracao_maxima_minutos:   limite da apresentação em minutos; deixe vazio quando não houver.
# checklist:                itens exigidos pela professora. "estado" é a avaliação técnica atual;
#                           "onde" é o id do slide que apresenta o item; "confirmado_pela_equipe"
#                           vira true somente depois que a equipe revisar o item.
entregas:
  - id: primeira
    titulo: "Primeira Entrega dos Projetos"
    rotulo: "1ª entrega"
    prazo: "23 de setembro de 2026, às 19h30"
    data_apresentacao: "23 de setembro de 2026"
    duracao_maxima_minutos:
    checklist:
      - item: "Lista de requisitos refinada"
        estado: aguardando_evidencia
        onde: requisitos
        observacao: "Depende da consolidação do card #13; há conflitos de requisitos em aberto."
        confirmado_pela_equipe: false
      - item: "Lista de ferramentas e tecnologias escolhidas"
        estado: implementado
        onde: arquitetura
        observacao: "Stack comprovada no repositório; versões lidas do Gemfile.lock."
        confirmado_pela_equipe: false
      - item: "Diagrama de casos de uso do sistema"
        estado: aguardando_evidencia
        onde: casos-de-uso
        observacao: "Card #14 em aberto; nenhuma imagem do diagrama no repositório."
        confirmado_pela_equipe: false
      - item: "Trello ativo com requisitos e links para ambientes"
        estado: parcial
        onde: gestao
        observacao: "Quadro e cards existem; não há ambiente publicado para linkar além do GitHub."
        confirmado_pela_equipe: false
      - item: "Planejamento dos próximos passos"
        estado: parcial
        onde: proximos-passos
        observacao: "Próximos passos listados; o marco demonstrável aguarda decisão."
        confirmado_pela_equipe: false
      - item: "Reflexão sobre o período (lições aprendidas)"
        estado: aguardando_evidencia
        onde: retrospectiva
        observacao: "Depende do registro real da retrospectiva."
        confirmado_pela_equipe: false

  - id: segunda
    titulo: "Segunda Entrega de Projeto — Status Report 2"
    rotulo: "2ª entrega"
    prazo: "19 de outubro de 2026, às 18h"
    # Preencha quando a data da apresentação em sala for confirmada (ex.: "20 de outubro de 2026").
    data_apresentacao:
    duracao_maxima_minutos: 7
    checklist:
      - item: "Protótipo com o conceito visual do projeto"
        estado: parcial
        onde: conceito-visual
        observacao: "Landing e login implementados no Rails; alertas da landing são demonstrativos."
        confirmado_pela_equipe: false
      - item: "GitHub criado e estruturado"
        estado: implementado
        onde: gestao
        observacao: "Repositório com CI (RSpec, RuboCop, Brakeman, auditoria do Importmap) e Dependabot."
        confirmado_pela_equipe: false
      - item: "Código contemplando duas funcionalidades completas"
        estado: aguardando_decisao
        onde: funcionalidades
        observacao: "A equipe ainda precisa escolher e validar as duas funcionalidades."
        confirmado_pela_equipe: false
      - item: "Imagem de uma retrospectiva"
        estado: aguardando_evidencia
        onde: retrospectiva
        observacao: "Adicionar a imagem real da retrospectiva."
        confirmado_pela_equipe: false
      - item: "Modelo conceitual"
        estado: parcial
        onde: modelo-conceitual
        observacao: "Modelo conceitual e DER do card #6 com premissas provisórias; aguarda revisão da equipe. Não substitui o fluxo (#5) nem os casos de uso (#14)."
        confirmado_pela_equipe: false
      - item: "Evidência de reuniões de monitoramento"
        estado: aguardando_evidencia
        onde: gestao
        observacao: "Registrar data, participantes e pauta de cada reunião."
        confirmado_pela_equipe: false
      - item: "O que foi feito desde a última entrega"
        estado: parcial
        onde: evolucao
        observacao: "Linha do tempo baseada nos commits; falta confirmar o marco da primeira entrega."
        confirmado_pela_equipe: false
      - item: "O que será feito até a próxima entrega"
        estado: parcial
        onde: proximos-passos
        observacao: "Próximos passos listados; o marco demonstrável aguarda decisão."
        confirmado_pela_equipe: false
      - item: "O que a equipe aprendeu no período"
        estado: aguardando_evidencia
        onde: retrospectiva
        observacao: "Depende do registro da retrospectiva."
        confirmado_pela_equipe: false
      - item: "Apresentação de no máximo 7 minutos"
        estado: parcial
        onde: roteiro
        observacao: "Estimativa calculada a partir dos slides selecionados (ver apêndice); ensaio cronometrado pendente."
        confirmado_pela_equipe: false
