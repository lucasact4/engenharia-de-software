      column: record_id
      label: Foto de alerta · polimórfico
      source_cardinality: 0..5
      target_cardinality: '1'
      kind: polymorphic
  conceptual:
    title: Modelo conceitual do SGU
    description: Conceitos e multiplicidades. Denúncia tem exatamente um alvo; pânico
      não gera publicação nem interações sociais.
    width: 1340
    height: 920
    nodes:
    - id: role
      title: Papel
      x: 46.0
      "y": 62.0
      width: 260.0
      lines:
      - Segurança · Coordenação
      - Professor · Estudante
      - Funcionário · Visitante
      - Morador · multiperfil · não é admin
    - id: person
      title: Pessoa usuária
      x: 358.0
      "y": 62.0
      width: 286.0
      lines:
      - conta por e-mail e senha
      - 'administração: booleano admin'
      - perfil público opcional (opt-in)
      - desativação preserva o histórico
      variant: core
    - id: interactions
      title: Interações sociais
      x: 700
      "y": 62.0
      width: 286.0
      lines:
      - curtir · salvar (privado)
      - acompanhar publicação ou alerta
      - seguir pessoa com perfil público
      - nenhuma interação concede acesso
    - id: audit
      title: Evento de auditoria
      x: 1030
      "y": 62.0
      width: 260.0
      lines:
      - ator · ação · data · motivo
      - antes/depois (allowlist)
      - append-only na aplicação
      - sem GPS, senha ou texto pessoal
    - id: category
      title: Categoria
      x: 46.0
      "y": 310
      width: 260.0
      lines:
      - assunto (7 categorias propostas)
      - '"Outro" exige explicação'
    - id: location
      title: Local do campus
      x: 46.0
      "y": 460
      width: 260.0
      lines:
      - prédio ou área (catálogo)
      - não é o GPS de quem reporta
    - id: alert
      title: Alerta
      x: 358.0
      "y": 310
      width: 286.0
      lines:
      - 'tipo: Ocorrência | Pânico'
      - protocolo opaco do servidor
      - 'local: GPS · manual · indisponível'
      - severidade percebida / avaliada
      - prioridade (somente na triagem)
      - situação do atendimento
      - audiência solicitada / efetiva
      - 'pânico: restrito, sem circuito social'
      variant: core
    - id: photo
      title: Foto (anexo)
      x: 700
      "y": 310
      width: 260.0
      lines:
      - PNG ou JPEG, até 5 MiB
      - privada; entrega autorizada
      - nunca reaproveitada como pública
    - id: dimensions
      title: Dimensões distintas
      x: 1030
      "y": 310
      width: 260.0
      lines:
      - categoria = assunto
      - severidade = impacto
      - prioridade = triagem
      - situação = atendimento
      - audiência = autorização
      - Premissas provisórias
      - foto opcional
      - 'restrita: autor + gestão'
      - acesso de coordenação e
      - segurança a validar
      - identidade pública neutra
      - sem perfil público
      - propostas, não aprovação
      - da equipe
      variant: note
    - id: report
      title: Denúncia
      x: 46.0
      "y": 740
      width: 260.0
      lines:
      - motivo · situação da análise
      - uma por pessoa e alvo
      - só denunciante e gestão veem
      - não oculta conteúdo sozinha
    - id: publication
      title: Publicação
      x: 358.0
      "y": 740
      width: 286.0
      lines:
      - ocorrência · aviso · notícia
      - texto e audiência próprios
      - aprovada não é publicada
      - aviso expira; fonte pode ser nula
      - Bloqueio da fonte impede divulgação
      variant: core
    - id: comment
      title: Comentário
      x: 700
      "y": 740
      width: 260.0
      lines:
      - raiz + 1 nível de respostas
      - acesso herdado da publicação
      - remoção preserva respostas
