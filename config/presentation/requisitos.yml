# Problema, proposta, escopo e regras. A consolidação depende do card #13.
# Não marque propostas como aprovadas sem evidência (ata, card concluído ou documento versionado).

card_refinamento:
  numero: 13
  titulo: "Refinar RFs e RNFs do SGU"
  url: "https://trello.com/c/NAOYejRl/13-requisitos-refinar-rfs-e-rnfs-do-sgu"

# Documento oficial de requisitos (preencher quando o card #13 for concluído).
documento:
  titulo:
  versao:
  origem:     # ex.: "Google Docs — versão exportada em 15/10/2026" ou URL pública
  url:

problema:
  frase: "Situações de infraestrutura, acessibilidade e segurança no campus precisam chegar a quem pode agir — e a comunidade precisa acompanhar o que acontece depois."
  dores:
    - titulo: "Registro disperso"
      texto: "Sem um canal único, o relato tende a depender de conversas, grupos e contatos pessoais."
    - titulo: "Retorno invisível"
      texto: "Quem comunica um problema precisa saber se ele foi recebido, analisado ou resolvido."
    - titulo: "Alertas sem alcance"
      texto: "Avisos de interesse coletivo precisam chegar de forma organizada a toda a comunidade."
  fonte: "Premissas que orientam o projeto — revisar com o documento de requisitos (#13)."

publico:
  - "Estudantes"
  - "Professores"
  - "Funcionários"
  - "Equipes de segurança"
  - "Visitantes"

# Fluxo de valor apresentado na landing (app/views/home/index.html.erb).
fluxo_valor:
  - titulo: "Comunique"
    texto: "Registro com categoria, foto e localização aproximada."
  - titulo: "Acompanhe"
    texto: "Status claro para quem registrou."
  - titulo: "Compartilhe"
    texto: "Atualizações coletivas no portal público."

# Dimensões independentes de uma ocorrência.
dimensoes:
  - nome: "Categoria"
    pergunta: "Sobre o quê?"
    exemplos: ["Infraestrutura", "Mobilidade e acesso", "Segurança"]
    estado: implementado
    nota: "Catálogo administrável, com descrições e exemplos no formulário."
  - nome: "Severidade"
    pergunta: "Qual o impacto da situação?"
    exemplos: ["Leve", "Moderada", "Alta", "Crítica", "Não sei avaliar"]
    estado: implementado
    nota: "Critérios orientados pelo impacto em pessoas, acessibilidade, serviços e patrimônio. O autor pode não avaliar; a equipe registra sua avaliação separadamente."
  - nome: "Prioridade"
    pergunta: "Em que ordem a equipe deve atender?"
    exemplos: ["Baixa", "Normal", "Alta", "Urgente"]
    estado: implementado
    nota: "Definida pela equipe na triagem para ordenar a fila; não é calculada automaticamente a partir da severidade percebida."
  - nome: "Status"
    pergunta: "Em que etapa?"
    exemplos: ["Recebida", "Em análise", "Resolvida"]
    estado: implementado
    nota: "Recebimento, análise, encaminhamento e resolução no atendimento."
  - nome: "Visibilidade"
    pergunta: "Quem pode ver?"
    exemplos: ["Público", "Interno", "Privado"]
    estado: aguardando_decisao
    nota: "Regra implementada: post interno para autenticados; externo direto para verificados ou após aprovação; pânico e detalhes operacionais restritos."

regra_dimensoes: "Categoria, severidade, prioridade, status e visibilidade são dimensões independentes: uma ocorrência urgente pode ser privada, uma ocorrência grave pode aguardar avaliação da equipe e uma ocorrência resolvida pode continuar pública."

# Requisitos refinados deste recorte, com base na lista vigente enviada pelo responsável do projeto.
# A referência a um documento oficial permanece pendente até que o artefato seja disponibilizado.
# Formato:
#   - id: "RF001"                     # identificador do documento
#     tipo: funcional                 # funcional | nao_funcional
#     titulo: "Registrar ocorrência"
#     descricao: "A pessoa autenticada registra uma ocorrência com categoria e local."
#     mvp: true                       # opcional: entra no MVP
#     criterios_aceite:               # condições verificáveis (ex.: Dado/Quando/Então)
#       - "Dado um usuário autenticado, quando enviar categoria e local, então a ocorrência fica com status Recebida."
#     estado: planejado               # implementado | parcial | planejado | aguardando_decisao | aguardando_evidencia
requisitos_refinados:
  - id: "RF009"
    tipo: funcional
    titulo: "Exigir localização em ocorrência comum"
    descricao: "Toda ocorrência comum deve informar o local por GPS, ponto no mapa ou local selecionado/descrito. Pedidos de pânico podem usar a localização indisponível quando a pessoa não puder compartilhá-la."
    criterios_aceite:
      - "Uma ocorrência comum sem localização não é salva; o formulário explica que GPS, ponto no mapa ou local cadastrado/descrição são aceitos."
      - "GPS e mapa exigem latitude e longitude válidas; precisão e horário de captura só são registrados quando a origem é GPS."
      - "A origem manual exige local cadastrado ou descrição com pelo menos 3 caracteres e não grava coordenadas."
      - "Um pedido de pânico pode ser registrado sem coordenadas quando a localização está indisponível, com o motivo informado."
    estado: implementado
  - id: "RF017"
    tipo: funcional
    titulo: "Classificar severidade separadamente da prioridade"
    descricao: "A severidade descreve o impacto percebido ou avaliado; a prioridade é definida pela equipe para ordenar o atendimento."
    criterios_aceite:
      - "Leve indica impacto localizado e pequeno, sem risco relevante à segurança ou interrupção importante."
      - "Moderada indica impacto no uso de um espaço ou serviço, sem perigo imediato."
      - "Alta indica interrupção importante ou risco significativo para pessoas, acessibilidade ou patrimônio."
      - "Crítica indica ameaça grave e imediata à vida ou à integridade física; a orientação também indica procurar os serviços de emergência."
      - "O autor pode escolher Não sei avaliar; a severidade percebida, a severidade avaliada pela equipe e a prioridade são armazenadas separadamente."
    estado: implementado

# Conflitos conhecidos entre versões dos requisitos.
conflitos:
  - id: "RF005"
    tema: "Postagem e autenticação"
    anterior: "Permite postagem sem login."
    proposta: "Exigir autenticação para registrar ocorrências."
    estado: aguardando_decisao
  - id: "RF007"
    tema: "Foto da ocorrência"
    anterior: "Foto opcional."
    proposta: "Foto obrigatória."
    estado: aguardando_decisao
  - id: "RF012"
    tema: "Localização em tempo real"
    anterior: "Localização em tempo real."
    proposta: "Tratar separadamente do botão de pânico: não são sinônimos."
    estado: aguardando_decisao
  - id: "Visibilidade"
    tema: "Público, interno e privado"
    anterior: "Níveis citados sem regras de acesso."
    proposta: "Aprovar quem vê cada nível e quem pode alterá-lo."
    estado: aguardando_decisao
  - id: "Cadastro"
    tema: "Cadastro e verificação institucional"
    anterior: "Regras não consolidadas."
    proposta: "Cadastro exige @ufrpe.br e perfil estudante, professor ou visitante. Revisão administrativa disponível; liberação automática e confirmação de e-mail pendente em desenvolvimento."
    estado: aguardando_decisao
