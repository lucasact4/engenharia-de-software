development:
  deliver_notifications:
    class: DeliverNotificationsJob
    schedule: every 15 seconds

production:
  security_presence_cleanup:
    class: SecurityPresenceCleanupJob
    queue: maintenance
    schedule: "* * * * * UTC"
  deliver_notifications:
    class: DeliverNotificationsJob
    schedule: every 15 seconds
  storage_backup:
    class: StorageBackupJob
    queue: backups
    schedule: "0 * * * * UTC"
